<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>喜报生成器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#f3ead8;min-height:100vh;padding:16px 12px 40px}
.pt{text-align:center;font-size:20px;font-weight:700;color:#a0120e;letter-spacing:2px;margin-bottom:4px}
.ps{text-align:center;font-size:12px;color:#8a6d3b;margin-bottom:14px}
.pw{background:#fff;border-radius:12px;padding:10px;box-shadow:0 4px 16px rgba(160,18,14,.15);margin-bottom:16px;text-align:center}
#pv{max-width:100%;height:auto;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.tip{font-size:11px;color:#b08850;text-align:center;margin-top:6px}
.cd{background:#fff;border-radius:12px;padding:14px 14px 8px;box-shadow:0 2px 10px rgba(0,0,0,.06);margin-bottom:14px}
.ct{font-size:14px;font-weight:700;color:#a0120e;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.ct::before{content:"";width:4px;height:14px;background:#d33a2c;border-radius:2px}
.f{margin-bottom:12px}
.f label{display:block;font-size:12px;color:#666;margin-bottom:5px}
.f input{width:100%;padding:10px 12px;font-size:15px;border:1px solid #e3d5b8;border-radius:8px;background:#fdfaf3;outline:none;color:#333}
.f input:focus{border-color:#c03020;background:#fff}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;padding:14px;font-size:17px;font-weight:700;background:linear-gradient(135deg,#d4351f,#a0120e);color:#fff;border:none;border-radius:10px;letter-spacing:2px;box-shadow:0 4px 12px rgba(160,18,14,.35);margin-top:4px}
.btn:active{transform:scale(.98)}
.bs{margin-bottom:10px}
.br{background:linear-gradient(135deg,#f5e6c8,#e8d3a8);color:#8a5a20;box-shadow:0 2px 8px rgba(138,90,32,.2)}
/* 背景模板选择 */
.vbar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.vb{padding:9px 2px;font-size:12px;font-weight:700;background:#fdfaf3;border:1px solid #e3d5b8;border-radius:8px;color:#8a6d3b;cursor:pointer}
.vb.on{background:linear-gradient(135deg,#d4351f,#a0120e);color:#fff;border-color:#a0120e;box-shadow:0 2px 6px rgba(160,18,14,.3)}
/* 信息区动态行 */
.btn2{width:100%;padding:12px;font-size:15px;font-weight:700;background:#fff;color:#a0120e;border:1px dashed #d33a2c;border-radius:8px;margin-top:4px;cursor:pointer}
.frow{display:flex;gap:8px;align-items:flex-end;margin-bottom:10px}
.frow .f{flex:1;margin-bottom:0}
.del{flex:0 0 44px;height:44px;border:none;border-radius:8px;background:#f7e2e2;color:#c0120e;font-size:22px;font-weight:700;cursor:pointer}
.ftip{font-size:11px;color:#b08850;margin-top:6px}
.prow{display:flex;align-items:center;gap:8px;margin-top:6px;min-height:40px}
.prow img{height:40px;max-width:56px;object-fit:contain;background:#f7ede0;border-radius:4px;display:none}
.prow span{font-size:11px;color:#8a6d3b;flex:1}
.prm{border:none;background:#f7e2e2;color:#c0120e;border-radius:6px;padding:6px 10px;font-size:12px;cursor:pointer;display:none}
.ft{text-align:center;font-size:11px;color:#b09a70;margin-top:14px}
</style>
</head>
<body>
<div class="pt">喜报生成器</div>
<div class="ps">每日一单 工资翻番</div>
<div class="pw"><canvas id="pv"></canvas><div class="tip">长按图片可保存到手机</div></div>
<div class="cd"><div class="ct">背景模板</div><div class="vbar" id="vbar"></div><div class="ftip">四款新背景，切换后下面所有信息自动适配排版</div></div>
<div class="cd"><div class="ct">支局信息</div>
<div class="f"><label>支局名称</label><input id="i_branch" value="二七嵩山" maxlength="10"></div>
<div class="f"><label>今日第几单</label><input id="i_order" value="1" maxlength="4"></div></div>
<div class="cd"><div class="ct">信息区（样式固定，可增删行、可改说明与数值）</div>
<div id="field-list"></div>
<button type="button" class="btn2" onclick="addField()">＋ 添加一行</button>
<div class="ftip">左侧填说明（如：业务：/积分：/收益：…），右侧填数值；可点"＋"增行、"×"删行</div>
</div>
<div class="cd"><div class="ct">CP小组</div>
<div class="f"><label>CP人员（如：王强&徐萌萌）</label><input id="i_cp" value="王强&徐萌萌" maxlength="20"></div></div>
<div class="cd"><div class="ct">人像照片（选填，最多2张）</div>
<div class="r2">
<div class="f"><label>人像1</label><input type="file" accept="image/*" id="pf1"><div class="prow"><img id="pm1" alt=""><span id="ps1">未选择</span><button type="button" class="prm" id="px1" onclick="clearP(1)">移除</button></div></div>
<div class="f"><label>人像2</label><input type="file" accept="image/*" id="pf2"><div class="prow"><img id="pm2" alt=""><span id="ps2">未选择</span><button type="button" class="prm" id="px2" onclick="clearP(2)">移除</button></div></div>
</div>
<div class="ftip">上传后自动AI抠图，人像插入当前模板中部（喜报→人像→人名→信息）；不上传则用各模板默认版式。首次使用需联网加载AI模型约8MB，之后有缓存</div>
</div>
<button class="btn bs" onclick="saveImg()">生成图片</button>
<button class="btn br" onclick="reset()">恢复默认</button>
<div class="ft">点击"生成图片"弹出大图，长按保存</div>

/* ===== 信息区动态行 ===== */
function rowHtml(f,i){
  return '<div class="frow">'+
    '<div class="f"><label>说明（可改）</label><input class="r-l" value="'+esc(f.l)+'"></div>'+
    '<div class="f"><label>数值（可改）</label><input class="r-v" value="'+esc(f.v)+'"></div>'+
    '<button type="button" class="del" onclick="delField(this)">×</button>'+
    '</div>';
}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function renderFields(arr){
  var box=document.getElementById('field-list');
  box.innerHTML='';
  (arr||[]).forEach(function(f){box.insertAdjacentHTML('beforeend',rowHtml(f))});
  box.querySelectorAll('input').forEach(function(inp){inp.addEventListener('input',draw)});
}
function collectFields(){
  var out=[];
  document.querySelectorAll('#field-list .frow').forEach(function(r){
    var l=r.querySelector('.r-l').value.trim();
    var v=r.querySelector('.r-v').value.trim();
    if(l||v)out.push({l:l,v:v});
  });
  return out;
}
window.addField=function(){
  var box=document.getElementById('field-list');
  box.insertAdjacentHTML('beforeend',rowHtml({l:"",v:""}));
  box.querySelectorAll('input').forEach(function(inp){inp.addEventListener('input',draw)});
  draw();
};
window.delField=function(btn){btn.parentNode.remove();draw()};

/* 超宽自动缩小字号（返回调整后的font） */
function fitFont(t,f0,maxW){
  if(!t)return f0;
  x.font=f0;
  var w=x.measureText(t).width;
  if(w<=maxW)return f0;
  var m=f0.match(/([\d.]+)px/),sz=parseFloat(m[1]);
  var nsz=Math.max(12,Math.floor(sz*maxW/w));
  return f0.replace(/([\d.]+)px/,nsz+'px');
}
/* 圆角矩形路径 */
function rr(px,py,w,h,r){
  x.beginPath();
  x.moveTo(px+r,py);
  x.arcTo(px+w,py,px+w,py+h,r);
  x.arcTo(px+w,py+h,px,py+h,r);
  x.arcTo(px,py+h,px,py,r);
  x.arcTo(px,py,px+w,py,r);
  x.closePath();
}

/* ===== 人像模块：上传照片 → MediaPipe AI抠图 → 画布合成 ===== */
var P={c1:null,c2:null};
var MP={st:0,seg:null,cb:[]};
function pStatus(i,txt){document.getElementById('ps'+i).textContent=txt}
function pShow(i){
  document.getElementById('px'+i).style.display='';
  var th=document.getElementById('pm'+i);th.style.display='';
}
function pHide(i){
  document.getElementById('px'+i).style.display='none';
  var th=document.getElementById('pm'+i);th.style.display='none';th.removeAttribute('src');
  document.getElementById('ps'+i).textContent='未选择';
  document.getElementById('pf'+i).value='';
}
function ensureMP(cb){
  if(MP.st===2){cb(null);return}
  MP.cb.push(cb);
  if(MP.st===1)return;
  MP.st=1;
  /* 新一代 MediaPipe Tasks API: ImageSegmenter 同步处理静止图片, 无回调链 */
  var imp;
  try{imp=import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs')}
  catch(e){imp=Promise.reject(e)}
  imp.then(function(V){
    return V.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm').then(function(fs){
      return V.ImageSegmenter.createFromOptions(fs,{
        baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite',delegate:'CPU'},
        runningMode:'IMAGE',
        outputConfidenceMasks:true
      });
    });
  }).then(function(seg){
    MP.seg=seg;MP.st=2;
    var q=MP.cb;MP.cb=[];q.forEach(function(f){f(null)});
  }).catch(function(e){
    MP.st=0;
    var q=MP.cb;MP.cb=[];q.forEach(function(f){f(new Error('模型加载失败:'+(e&&e.message?e.message:'')))});
  });
}
function loadImgSrc(src,cb){var im=new Image();im.onload=function(){cb(im)};im.onerror=function(){cb(null)};im.src=src}
function processFile(i,dataUrl){
  pStatus(i,'AI模型加载中…（首次需联网）');
  ensureMP(function(err){
    if(err){pStatus(i,'模型加载失败：'+((err&&err.message)||'未知')+'，请重试');return}
    loadImgSrc(dataUrl,function(im){
      if(!im){pStatus(i,'照片读取失败');return}
      pStatus(i,'AI抠图中…');
      var cv=document.createElement('canvas');
      var sc=Math.min(1,900/Math.max(im.naturalWidth||im.width,im.naturalHeight||im.height));
      cv.width=Math.max(1,Math.round((im.naturalWidth||im.width)*sc));
      cv.height=Math.max(1,Math.round((im.naturalHeight||im.height)*sc));
      cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
      var res=null;
      try{res=MP.seg.segment(cv)}catch(e2){res=null}
      try{
        if(!res)throw new Error('segment error');
        var pc=mattePerson(cv,res);
        P['c'+i]=pc;
        var th=document.getElementById('pm'+i);th.src=pc.toDataURL();
        pShow(i);pStatus(i,'已抠图 ✓');
        draw();
      }catch(e){pStatus(i,'抠图失败：'+((e&&e.message)||'未知')+'，请重试或换一张')}
    });
  });
}
function mattePerson(srcCv,res){
  var mask=res&&res.confidenceMasks&&res.confidenceMasks[0];
  if(!mask)throw new Error('no mask');
  var w=srcCv.width,h=srcCv.height;
  var mw=mask.width,mh=mask.height;
  var conf=mask.getAsFloat32Array();
  var mk=document.createElement('canvas');mk.width=w;mk.height=h;
  var mc=mk.getContext('2d');
  var idata=mc.createImageData(w,h),md=idata.data;
  var minx=w,miny=h,maxx=-1,maxy=-1;
  for(var yy=0;yy<h;yy++)for(var xx=0;xx<w;xx++){
    var mx=Math.min(mw-1,(xx*mw/w)|0),my=Math.min(mh-1,(yy*mh/h)|0);
    var c=conf[my*mw+mx];
    /* 置信度0.45-0.65软边过渡, 发丝边缘更自然 */
    var fg=Math.max(0,Math.min(255,Math.round((c-0.45)/0.2*255)));
    var k=(yy*w+xx)*4;
    md[k]=md[k+1]=md[k+2]=255;md[k+3]=fg;
    if(fg>60){if(xx<minx)minx=xx;if(xx>maxx)maxx=xx;if(yy<miny)miny=yy;if(yy>maxy)maxy=yy}
  }
  if(maxx<0){if(res.close)res.close();throw new Error('no person')}
  mc.putImageData(idata,0,0);
  var bw=maxx-minx+1,bh=maxy-miny+1;
  var out=document.createElement('canvas');out.width=bw;out.height=bh;
  var oc=out.getContext('2d');
  oc.drawImage(srcCv,minx,miny,bw,bh,0,0,bw,bh);
  oc.globalCompositeOperation='destination-in';
  oc.drawImage(mk,minx,miny,bw,bh,0,0,bw,bh);
  if(res.close)res.close();
  return out;
}
function goldSil(pc){
  if(pc._gold)return pc._gold;
  var t=document.createElement('canvas');t.width=pc.width;t.height=pc.height;
  var tc=t.getContext('2d');tc.drawImage(pc,0,0);
  tc.globalCompositeOperation='source-in';
  var g=tc.createLinearGradient(0,0,0,t.height);
  g.addColorStop(0,'#FFE096');g.addColorStop(1,'#E8A94E');
  tc.fillStyle=g;tc.fillRect(0,0,t.width,t.height);
  pc._gold=t;return t;
}
/* 缩放到目标尺寸 + 渲染尺度边界去绿溢出(缓存): 掩码软边+JPEG渗色在显示分辨率下清理, 内部绿色衣物不受影响 */
function readyPerson(pc,w,h){
  var key='_r'+w+'x'+h;
  if(pc[key])return pc[key];
  var t=document.createElement('canvas');t.width=w;t.height=h;
  var tc=t.getContext('2d');tc.drawImage(pc,0,0,w,h);
  var id2=tc.getImageData(0,0,w,h),dp=id2.data;
  var AL2=new Uint8Array(w*h);
  for(var i=0;i<w*h;i++)AL2[i]=dp[i*4+3];
  var EZ=new Uint8Array(w*h);
  for(var e0=0;e0<w*h;e0++)EZ[e0]=AL2[e0]<200?1:0;
  for(var pass=0;pass<5;pass++){
    var cp=EZ.slice();
    for(var ey=0;ey<h;ey++)for(var ex=0;ex<w;ex++){
      var ei=ey*w+ex;
      if(cp[ei])continue;
      if((ex>0&&cp[ei-1])||(ex<w-1&&cp[ei+1])||(ey>0&&cp[ei-w])||(ey<h-1&&cp[ei+w]))EZ[ei]=1;
    }
  }
  for(var pi=0;pi<w*h;pi++){
    if(EZ[pi]||AL2[pi]<250){
      var q=pi*4;
      var lim=((dp[q]+dp[q+2])>>1)+8;
      if(dp[q+1]>lim)dp[q+1]=lim;
    }
  }
  /* 小块绿色封闭区清理: 夹缝凹袋等掩码误判的孤立绿区(≤600px)去绿; 大块绿色衣物(衬衫等)保留 */
  var GM=new Uint8Array(w*h);
  for(var gi=0;gi<w*h;gi++){
    var gq=gi*4;
    if(dp[gq+3]>200&&dp[gq+1]>((dp[gq]+dp[gq+2])>>1)+20)GM[gi]=1;
  }
  var VIS=new Uint8Array(w*h);
  for(var s0=0;s0<w*h;s0++){
    if(!GM[s0]||VIS[s0])continue;
    var stack=[s0];VIS[s0]=1;var comp=[];
    while(stack.length){
      var ci=stack.pop();comp.push(ci);
      var cx=ci%w,cy=(ci-cx)/w;
      if(cx>0&&!VIS[ci-1]&&GM[ci-1]){VIS[ci-1]=1;stack.push(ci-1)}
      if(cx<w-1&&!VIS[ci+1]&&GM[ci+1]){VIS[ci+1]=1;stack.push(ci+1)}
      if(cy>0&&!VIS[ci-w]&&GM[ci-w]){VIS[ci-w]=1;stack.push(ci-w)}
      if(cy<h-1&&!VIS[ci+w]&&GM[ci+w]){VIS[ci+w]=1;stack.push(ci+w)}
    }
    if(comp.length<=600){
      for(var cj=0;cj<comp.length;cj++){
        var q2=comp[cj]*4;
        var lim2=((dp[q2]+dp[q2+2])>>1)+8;
        if(dp[q2+1]>lim2)dp[q2+1]=lim2;
      }
    }
  }
  tc.putImageData(id2,0,0);
  pc[key]=t;
  return t;
}

/* ================= 通用模板绘制（4款新背景） ================= */
function drawCardG(cd){
  x.fillStyle=cd.fill;rr(cd.x,cd.y,cd.w,cd.h,cd.r||16);x.fill();
  if(cd.stroke){x.strokeStyle=cd.stroke;x.lineWidth=cd.lineWidth||2;rr(cd.x+1.5,cd.y+1.5,cd.w-3,cd.h-3,Math.max(2,(cd.r||16)-1.5));x.stroke()}
}
function drawBandG(b){
  var gr=x.createLinearGradient(0,b.y,0,b.y+b.h);
  gr.addColorStop(0,'#DB2418');gr.addColorStop(1,'#C31A0E');
  x.fillStyle=gr;rr(b.x,b.y,b.w,b.h,b.r||14);x.fill();
  x.strokeStyle='rgba(240,190,110,.6)';x.lineWidth=1.5;rr(b.x+.75,b.y+.75,b.w-1.5,b.h-1.5,(b.r||14)-.75);x.stroke();
}
function drawOrderText(o,val){
  if(!val)val='1';
  var f=function(s){return 'bold '+s+'px "微软雅黑"'};
  x.font=f(o.size);var w1=x.measureText('今日第').width;
  x.font=f(Math.round(o.size*1.08));var w2=x.measureText(val).width;
  x.font=f(o.size);var w3=x.measureText('单').width;
  var tot=w1+w2+w3,sc=tot>o.maxW?o.maxW/tot:1;
  var s1=Math.max(24,Math.round(o.size*sc)),s2=Math.round(s1*1.08);
  x.font=f(s1);w1=x.measureText('今日第').width;
  x.font=f(s2);w2=x.measureText(val).width;
  x.font=f(s1);w3=x.measureText('单').width;
  /* 整组居中于o.x；N两侧各留半字符等距间隙，N精确居中于第与单之间 */
  var G=Math.round(s1*0.5);
  var sx=o.x-(w1+w2+w3+G*2)/2;
  x.textAlign='left';x.textBaseline='alphabetic';
  x.font=f(s1);x.fillStyle=o.base;x.fillText('今日第',sx,o.y);
  x.font=f(s2);x.fillStyle=o.num;x.fillText(val,sx+w1+G,o.y);
  x.font=f(s1);x.fillStyle=o.base;x.fillText('单',sx+w1+G+w2+G,o.y);
}
function paintRowG(r,y,vf,lf,st){
  x.strokeStyle=st.lineC;x.lineWidth=st.lineW||2.5;
  x.beginPath();x.moveTo(st.l0,y);x.lineTo(st.l1,y);x.stroke();
  x.textAlign='left';
  x.font=fitFont(r.l,lf+'px "华文隶书","STLiti","微软雅黑"',st.labelMax||150);
  x.fillStyle=st.labelC;x.fillText(r.l,st.lx,y-5);
  x.textAlign='center';
  x.font=fitFont(r.v,'bold '+vf+'px "微软雅黑"',st.valueMax||330);
  x.fillStyle=st.valueC;x.fillText(r.v,st.vx,y-6);
}
function drawPeopleG(pp){
  var list=[];if(P.c1)list.push(P.c1);if(P.c2)list.push(P.c2);
  if(!list.length)return;
  x.save();x.beginPath();x.rect(0,pp.clipTop,750,pp.footY-pp.clipTop+40);x.clip();
  var H=pp.H,MAXW=pp.MAXW,GAP=pp.GAP,CX=pp.CX,FOOTY=pp.footY;
  var dims=[];
  for(var i=0;i<list.length;i++){
    var pc=list[i];
    var w=Math.round(pc.width*H/pc.height);
    if(w>MAXW)dims.push({pc:pc,w:MAXW,h:Math.round(pc.height*MAXW/pc.width)});
    else dims.push({pc:pc,w:w,h:H});
  }
  var totW=GAP*(dims.length-1);
  dims.forEach(function(d){totW+=d.w});
  var sx=CX-totW/2;
  dims.forEach(function(d){
    var dx=Math.round(sx),dy=FOOTY-d.h;
    var pc2=readyPerson(d.pc,d.w,d.h);
    x.save();x.translate(dx+d.w/2,FOOTY-3);x.scale(1,0.30);
    var sg=x.createRadialGradient(0,0,2,0,0,d.w*0.62);
    sg.addColorStop(0,'rgba(85,18,4,0.55)');sg.addColorStop(1,'rgba(85,18,4,0)');
    x.fillStyle=sg;x.beginPath();x.arc(0,0,d.w*0.62,0,6.2832);x.fill();x.restore();
    var gs=goldSil(pc2);
    x.save();x.shadowColor='rgba(255,200,110,0.85)';x.shadowBlur=11;
    x.drawImage(gs,dx,dy,d.w,d.h);x.drawImage(gs,dx,dy,d.w,d.h);x.restore();
    for(var k=0;k<8;k++){var a=k*Math.PI/4;x.drawImage(gs,dx+Math.cos(a)*2.4,dy+Math.sin(a)*2.4,d.w,d.h)}
    for(var k2=0;k2<8;k2++){var a2=k2*Math.PI/4;x.drawImage(gs,dx+Math.cos(a2)*1.2,dy+Math.sin(a2)*1.2,d.w,d.h)}
    x.drawImage(pc2,dx,dy,d.w,d.h);
    sx+=d.w+GAP;
  });
  x.restore();
}
function drawG(g,d){
  var L=d.hasP?g.ppl:g.def;
  c.width=g.W;c.height=g.H;
  if(g.imgEl&&g.imgEl.complete&&g.imgEl.naturalWidth){x.drawImage(g.imgEl,0,0,g.W,g.H)}
  else{x.fillStyle='#A50D12';x.fillRect(0,0,g.W,g.H)}
  x.textBaseline='alphabetic';
  if(g.kick){x.textAlign='center';x.font=fitFont(d.branch,'bold '+g.kick.size+'px "华文行楷","STXingkai","微软雅黑"',g.kick.maxW);x.fillStyle=g.kick.color;x.fillText(d.branch,g.kick.x,g.kick.y)}
  if(!g.kick&&L.branch){x.textAlign='center';x.font=fitFont(d.branch,'bold '+L.branch.size+'px "华文行楷","STXingkai","微软雅黑"',L.branch.maxW);x.fillStyle=L.branch.color;x.fillText(d.branch,L.branch.x,L.branch.y)}
  if(L.order)drawOrderText(L.order,d.order||'1');
  if(L.card)drawCardG(L.card);
  if(d.rows.length){
    var n=d.rows.length,rs=L.rows,ys;
    if(n===1)ys=[Math.round((rs.yS+rs.yE)/2)];
    else{var stp=(rs.yE-rs.yS)/(n-1);ys=[];for(var i=0;i<n;i++)ys.push(Math.round(rs.yS+stp*i))}
    var vf=42,lf=34;
    if(n>1){var sp=ys[1]-ys[0];if(sp<52){vf=Math.min(42,Math.max(18,Math.round(sp*0.8)));lf=Math.min(34,Math.max(13,Math.round(sp*0.55)))}}
    for(var i2=0;i2<n;i2++)paintRowG(d.rows[i2],ys[i2],vf,lf,rs);
  }
  if(d.hasP&&L.pp)drawPeopleG(L.pp);
  var cb=L.cp;
  if(cb){
    if(cb.band)drawBandG(cb.band);
    if(cb.label){x.textAlign='center';x.font='bold '+cb.label.size+'px "华文行楷","STXingkai","微软雅黑"';x.fillStyle=cb.label.color;x.fillText('CP小组',cb.label.x,cb.label.y)}
    if(d.cp&&cb.names){
      var txt=(cb.names.prefix?'CP小组：':'')+d.cp;
      var fnt=fitFont(txt,'bold '+cb.names.size+'px "微软雅黑"',cb.names.maxW);
      x.font=fnt;
      if(cb.names.shadow){x.shadowColor='rgba(90,0,0,0.45)';x.shadowBlur=6;x.shadowOffsetY=2}
      x.textAlign='center';x.fillStyle=cb.names.color;x.fillText(txt,cb.names.x,cb.names.y);
      x.shadowColor='transparent';x.shadowBlur=0;x.shadowOffsetY=0;
    }
  }
}

drawG(V[VI],{rows:rows,branch:branch,order:order,cp:cp,hasP:hasP});
}
